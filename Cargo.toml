[package]
name = "tinytts"
version = "0.1.0"
edition = "2021"
description = "Tiny, offline text-to-speech for Windows (Kokoro + sherpa-onnx)"
license = "MIT"
repository = "https://github.com/styayur/TinyTTS"
readme = "README.md"

[[bin]]
name = "TinyTTS"
path = "src/main.rs"

[features]
default = ["native"]
# The `native` feature pulls in the GUI and TTS runtime. Disable it to run the
# dependency-light core unit tests without a C toolchain or the sherpa-onnx
# native library:
#
#     cargo test --no-default-features
native = ["dep:sherpa-onnx", "dep:eframe", "dep:rodio", "dep:rfd", "dep:windows-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "2"
sherpa-onnx = { version = "1.13.8", optional = true }
eframe = { version = "0.31", optional = true }
rodio = { version = "0.19", optional = true }
rfd = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true