name: Bug report
description: Report a reproducible TinyTTS problem.
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: TinyTTS version
      description: Use Help > About or the release tag, for example v0.2.0.
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the shortest deterministic sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Paste relevant `logs/tinytts.log` lines. Remove API keys, private text, file paths, and personal data before posting.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private text, credentials, personal paths, and other sensitive data from this report.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
