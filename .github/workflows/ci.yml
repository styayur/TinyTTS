name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: .native/*.tar.bz2
          key: sherpa-static-2.0.0-win-x64-13cbef19
      - name: Restore and verify native libraries before cached Cargo builds
        run: |
          python -m unittest discover -s tests -p test_native_prepare.py
          python scripts/prepare_native.py --github-env
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Release build smoke test
        run: cargo build --release
      - name: Model trust-boundary regression
        run: python -m unittest discover -s tests -p test_model_prepare.py
      - uses: actions/cache@v6
        with:
          path: .test-model/*.tar.bz2
          key: kokoro-v1-54-speakers-60703707
      - name: Prepare the explicitly reviewed acceptance model
        run: python scripts/prepare_model.py --github-env
      - name: Actual native inference, cancellation and WAV acceptance
        run: |
          cargo build --locked --example native_model_acceptance
          python scripts/check_model_acceptance.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-model-acceptance
          path: |
            work/model-acceptance/report.json
            work/model-acceptance/native-report.toml
          if-no-files-found: error
