name: Release Windows portable build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to build, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact source is a signed-off release tag
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must use vX.Y.Z: $version" }
          git describe --exact-match --tags HEAD
      - name: Validate before packaging
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo build --release
      - name: Assemble stable portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' }
          $stage = Join-Path $env:RUNNER_TEMP 'TinyTTS'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/TinyTTS.exe $stage
          Copy-Item config.example.toml $stage
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md $stage
          $archive = "TinyTTS-windows-x64-$version.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $lines = @((Get-FileHash -Algorithm SHA256 $archive | ForEach-Object { "$($_.Hash.ToLower())  $archive" }))
          $lines | Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            TinyTTS-windows-x64-*.zip
            SHA256SUMS.txt
